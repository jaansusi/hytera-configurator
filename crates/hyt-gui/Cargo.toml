[package]
name = "hyt-gui"
description = "Desktop app (Tauri 2) to read, view, edit and write Hytera G2 radio settings without CPS"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "hyt-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hyt-core.workspace = true
hytera-proto.workspace = true
hytera-codeplug.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[features]
# Serve the embedded ui/ folder (Tauri's production mode). On by default because the app has no
# separate dev server: `cargo run -p hyt-gui` and `cargo build -p hyt-gui --release` both work.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
