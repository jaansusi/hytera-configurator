[package]
name = "hytera-proto"
description = "Serial programming protocol of Hytera G2 (Auctus platform) radios: link frames, commands, sessions"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = ["serial", "replay"]
# Real serial-port transport.
serial = ["dep:serialport"]
# Transport that replays a CPS recording (captures/*.jsonl) for offline tests.
replay = ["dep:serde_json"]

[dependencies]
serialport = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true
